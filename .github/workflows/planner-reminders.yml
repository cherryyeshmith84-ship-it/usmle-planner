name: Planner Reminders

# Vercel's own Cron Jobs are capped at 2 per project on the Hobby plan,
# and both are already used (plan-reminders, mentor-slot-reminders) - so
# these reminders are triggered from here instead, over a plain HTTPS
# request to the same Next.js API routes a Vercel cron would hit. GitHub
# Actions schedules are UTC only, same as Vercel's, so the morning
# reminder's time below drifts by an hour for a few weeks around the
# March/November US Daylight Saving changeovers - update by +/-1 hour then
# if exact timing matters. The 9pm reminder isn't affected by that drift -
# it runs every 15 minutes and checks each student's own stored timezone,
# not a fixed UTC offset.
on:
  schedule:
    # 12:30 UTC = 8:30 AM Eastern (EDT, UTC-4). Morning "here's what's scheduled" reminder.
    - cron: "30 12 * * *"
    # Every 15 minutes, all day - lets planner-9pm-reminder catch each
    # student's own local 9pm as it rolls around the world, rather than one
    # fixed moment in Eastern Time. Replaces the old fixed-9:30pm-ET
    # "evening-reminder" schedule that used to be here (see
    # app/api/cron/planner-9pm-reminder/route.ts's doc comment).
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  morning-reminder:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 12 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger morning planner reminder
        run: |
          curl -fsS -X GET "https://mastergrid.online/api/cron/planner-morning-reminder" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  nine-pm-reminder:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger 9pm-local planner reminder
        run: |
          curl -fsS -X GET "https://mastergrid.online/api/cron/planner-9pm-reminder" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
